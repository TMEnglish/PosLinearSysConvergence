name = "pos_linear_sys_convergence"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["PosLinearSysConvergence"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0"

[[lean_lib]]
name = "PosLinearSysConvergence"

# The independent check: `Challenge.lean` (statements only) and `Solution.lean` (the same
# statements, proved from the library above). Not built by default; see `comparator.json`.
[[lean_lib]]
name = "IndependentCheck"
globs = ["IndependentCheck.+"]
